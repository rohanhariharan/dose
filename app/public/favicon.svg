<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Dose">
  <title>Dose</title>
  <defs>
    <clipPath id="capsule">
      <rect x="2.5" y="10.5" width="27" height="11" rx="5.5" />
    </clipPath>
  </defs>
  <rect width="32" height="32" rx="7" fill="#161513" />
  <g transform="rotate(-45 16 16)">
    <g clip-path="url(#capsule)">
      <rect x="2.5" y="10.5" width="27" height="11" fill="#f5f4ef" />
      <rect x="16" y="10.5" width="13.5" height="11" fill="#4a6fae" />
    </g>
  </g>
</svg>
